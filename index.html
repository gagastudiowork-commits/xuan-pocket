<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2ff">
<title>小步影像｜小步工具所</title>
<style>
:root {
  font: 100%/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #1a3f7b;
  background: #f7f8fc;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
body { margin: 0; }
main {
  max-width: 760px;
  margin: auto;
  padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
    max(32px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.hero, section {
  border: 1px solid #dce4f2;
  border-radius: 20px;
  padding: clamp(14px, 4vw, 24px);
  margin-bottom: 14px;
}
.hero { background: linear-gradient(135deg, #e6ecff, #fff8f1); }
section { background: #fff; }
.eyebrow { font-weight: 700; color: #354b79; }
h1 { font-size: clamp(1.875rem, 5vw, 2.5rem); line-height: 1.2; margin: 8px 0; }
h2 { font-size: 1.25rem; line-height: 1.4; margin: 0 0 12px; }
p { color: #3c4e6b; margin: 8px 0; }
.drop {
  position: relative;
  display: block;
  border: 2px dashed #7184aa;
  background: #f3f7ff;
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
}
.drop strong { display: block; font-size: 1.125rem; }
.drop span { display: block; margin-top: 4px; color: #3c4e6b; }
.drop input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 650; }
.field select {
  min-height: 48px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid #7184aa;
  background: #fff;
  color: #173e72;
  font: inherit;
}
.quality-field { margin-top: 14px; }
input[type=range] { min-height: 48px; width: 100%; margin: 0; accent-color: #1a3f7b; }
.hint, .meta, .foot { color: #3c4e6b; }
.buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
button, .download {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: 12px;
  font: inherit;
  font-weight: 700;
  color: #fff;
  background: #1a3f7b;
  text-decoration: none;
  cursor: pointer;
}
#run { font-size: 1.125rem; }
button.secondary { background: #edf1f9; color: #1a3f7b; border-color: #7184aa; }
button:disabled { background: #e6ebf4; color: #475873; cursor: default; }
:focus-visible, .drop:focus-within { outline: 3px solid #355dcc; outline-offset: 3px; }
.status { padding: 12px; background: #eff5ff; border-radius: 12px; color: #224775; white-space: pre-wrap; }
.status, .hint, .name { overflow-wrap: anywhere; }
.files { display: grid; gap: 12px; }
.item {
  border: 1px solid #dce4f2;
  border-radius: 12px;
  padding: 10px;
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: #f2f5fa; }
.name { font-weight: 700; }
.meta { margin-top: 4px; }
.download { margin-top: 8px; }
.foot { text-align: center; }
@media (max-width: 520px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .buttons > *, .download { width: 100%; }
}
</style>
</head>
<body><main>
<header class="hero"><div class="eyebrow">小步工具所</div><h1>小步影像</h1><p>一次壓縮多張照片、調整尺寸。照片在你的裝置上處理。</p></header>
<section><h2>選擇照片</h2><label class="drop"><strong>＋ 點一下選取照片</strong><span id="photo-help">可一次選取多張照片</span><input id="photos" type="file" accept="image/*" aria-label="選取照片" aria-describedby="photo-help" multiple></label><p class="hint" id="picked">尚未選擇照片。</p><p class="hint">單張圖片建議不超過 20 MB；大量照片可能受到手機記憶體限制。</p></section>
<section><h2>輸出設定</h2><div class="grid"><div class="field"><label for="maxwidth">最大邊長</label><select id="maxwidth"><option value="0">保持原尺寸</option><option value="2048">2048 px</option><option value="1600" selected>1600 px</option><option value="1200">1200 px</option><option value="800">800 px</option></select></div><div class="field"><label for="format">輸出格式</label><select id="format"><option value="image/jpeg">JPG（較小、無透明）</option><option value="image/webp">WebP（支援時）</option><option value="image/png">PNG（支援透明）</option></select></div></div><div class="field quality-field"><label for="quality">壓縮品質：<output id="qualityText">80%</output></label><input type="range" id="quality" min="30" max="100" value="80" step="5"><div class="hint">適用 JPG / WebP。PNG 通常不依品質滑桿壓縮；輸出不一定比原圖小。</div></div><div class="buttons"><button id="run" disabled>開始處理</button><button id="clear" class="secondary" type="button">清除資料</button></div><p class="status" role="status" aria-live="polite" id="status">選擇照片後就能開始。</p></section>
<section><h2>處理結果</h2><div id="results" class="files"><p class="hint">完成後，這裡會出現每張照片的下載連結。iPhone 可點開下載或透過分享選單儲存至「照片／檔案」。</p></div></section>
<p class="foot">小步工具所 · v0.2<br>部分 HEIC 照片的讀取取決於瀏覽器支援。</p>
</main><script>
'use strict';
const $ = id => document.getElementById(id);
const picker=$('photos'),run=$('run'),status=$('status'),results=$('results');
const urls=new Set();
const readableSize=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';
function dispose(){for(const url of urls)URL.revokeObjectURL(url);urls.clear();results.replaceChildren();}
function alertStatus(s){status.textContent=s;}
$('quality').addEventListener('input',()=>{$('qualityText').textContent=$('quality').value+'%';});
picker.addEventListener('change',()=>{dispose();const files=[...picker.files];$('picked').textContent=files.length?`已選擇 ${files.length} 張照片，合計 ${readableSize(files.reduce((n,f)=>n+f.size,0))}`:'尚未選擇照片';run.disabled=!files.length;alertStatus(files.length?'設定完成後，點「開始處理」。':'選擇照片後就能開始。');});
$('clear').addEventListener('click',()=>{picker.value='';dispose();run.disabled=true;$('picked').textContent='尚未選擇照片';alertStatus('已清除此次選擇與處理結果。');});
function loadImage(file){return new Promise((resolve,reject)=>{const src=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(src);resolve(img);};img.onerror=()=>{URL.revokeObjectURL(src);reject(new Error('無法讀取此圖片格式'));};img.src=src;});}
function toBlob(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('瀏覽器無法輸出圖片')),type,quality));}
async function processOne(file,type,maxDim,quality){const img=await loadImage(file);const scale=maxDim?Math.min(1,maxDim/Math.max(img.naturalWidth,img.naturalHeight)):1;const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('記憶體不足或無法建立畫布');if(type==='image/jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);}ctx.drawImage(img,0,0,w,h);const blob=await toBlob(canvas,type,quality);canvas.width=canvas.height=0;const actualType=blob.type||type;const ext=actualType==='image/png'?'png':actualType==='image/webp'?'webp':'jpg';return {blob,w,h,ext,actualType};}
run.addEventListener('click',async()=>{const files=[...picker.files];if(!files.length)return;run.disabled=true;dispose();const type=$('format').value,maxDim=Number($('maxwidth').value),quality=Number($('quality').value)/100;let ok=0,failed=0;for(let i=0;i<files.length;i++){const file=files[i];alertStatus(`處理中 ${i+1}/${files.length}：${file.name}`);await new Promise(resolve=>setTimeout(resolve,0));try{const out=await processOne(file,type,maxDim,quality);const url=URL.createObjectURL(out.blob);urls.add(url);const item=document.createElement('div');item.className='item';const thumb=document.createElement('img');thumb.className='thumb';thumb.src=url;thumb.alt='處理後圖片預覽';const content=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=file.name;const meta=document.createElement('div');meta.className='meta';const pct=file.size?((out.blob.size-file.size)/file.size*100).toFixed(1):'0';meta.textContent=`${out.w}×${out.h} ｜ ${readableSize(file.size)} → ${readableSize(out.blob.size)} ｜ ${Number(pct)>0?'增加':'變化'} ${Math.abs(Number(pct))}%`;const link=document.createElement('a');link.className='download';link.href=url;link.download=(file.name.replace(/\.[^.]+$/,'')||'photo')+'_little-step.'+out.ext;link.textContent='下載圖片';content.append(name,meta,link);item.append(thumb,content);results.append(item);ok++;}catch(e){failed++;const p=document.createElement('p');p.className='hint';p.textContent=`${file.name}：${e.message}`;results.append(p);}}alertStatus(`處理完成：成功 ${ok} 張，失敗 ${failed} 張。${ok?'請點選個別下載連結。':''}`);run.disabled=false;});
</script></body></html>
